services:
  - type: web
    name: mybill-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: ALLOWED_ORIGINS
        # Firebase Hosting, explicit backend Render domain, plus local Flutter web debugging against Render.
        value: "https://mybill-app-04.firebaseapp.com,https://mybill-app-04.web.app,https://mybill-backend-vckc.onrender.com,http://localhost:*,http://127.0.0.1:*,http://[::1]:*"
      - key: PUBLIC_BASE_URL
        value: "https://mybill-backend-vckc.onrender.com"
      - key: JAVA_TOOL_OPTIONS
        value: "-Xms64m -Xmx256m -XX:+UseContainerSupport -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -XX:MaxDirectMemorySize=32m -Xss512k -XX:ActiveProcessorCount=1 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp -Xlog:gc*,safepoint:file=/tmp/mybill-gc.log:time,uptime,level,tags:filecount=3,filesize=5M -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/urandom"
