global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    environment: production
    service: mybill-backend

# Load alert rules
rule_files:
  - "prometheus-alerts.yml"

# Alertmanager connection
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: mybill-backend
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - backend:8080
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: mybill-backend

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
