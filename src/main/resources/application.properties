# ===============================
# MYBILL BACKEND - COMMON CONFIG
# ===============================

spring.application.name=MyBill_Backend
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
spring.jackson.time-zone=${APP_TIME_ZONE:Asia/Kolkata}
spring.jpa.properties.hibernate.jdbc.time_zone=${APP_TIME_ZONE:Asia/Kolkata}

# Default profile is prod.
# Render should override this using start command or env:
# SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# Server
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}



# Database Common
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Common
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# HikariCP Pool Optimization
spring.datasource.hikari.pool-name=MyBillHikariPool
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000

# Spring Data Pagination Defaults
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

# PostgreSQL prepared statement configuration
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# JWT Common
jwt.expiration=7200000

# Firebase Common
firebase.config.json=${FIREBASE_CONFIG_JSON:}

# Cache
spring.cache.type=caffeine
spring.cache.cache-names=dashboardStats,clientFinancialSummary,invoiceProjections,businessProfiles,invoiceSettings
spring.cache.caffeine.spec=maximumSize=${CACHE_MAX_SIZE:500},expireAfterWrite=5m
app.cache.dashboard.ttl-minutes=${DASHBOARD_CACHE_TTL_MINUTES:5}
app.cache.dashboard.max-size=${DASHBOARD_CACHE_MAX_SIZE:100}
app.cache.business-profiles.max-size=${BUSINESS_PROFILE_CACHE_MAX_SIZE:100}
app.cache.invoice-settings.max-size=${INVOICE_SETTINGS_CACHE_MAX_SIZE:100}

# API security and throttling
app.security.rate-limit.ip-per-minute=${RATE_LIMIT_IP_PER_MINUTE:120}
app.security.rate-limit.user-per-minute=${RATE_LIMIT_USER_PER_MINUTE:300}
app.security.rate-limit.auth-per-minute=${RATE_LIMIT_AUTH_PER_MINUTE:10}
app.security.rate-limit.public-quotation-per-minute=${RATE_LIMIT_PUBLIC_QUOTATION_PER_MINUTE:30}
app.security.rate-limit.public-quotation-action-per-minute=${RATE_LIMIT_PUBLIC_QUOTATION_ACTION_PER_MINUTE:8}
app.security.rate-limit.cloudinary-signature-per-minute=${RATE_LIMIT_CLOUDINARY_SIGNATURE_PER_MINUTE:5}
app.security.rate-limit.cloudinary-metadata-per-minute=${RATE_LIMIT_CLOUDINARY_METADATA_PER_MINUTE:10}
app.security.rate-limit.cache-max-size=${RATE_LIMIT_CACHE_MAX_SIZE:5000}
app.security.jwt-denylist.cache-max-size=${JWT_DENYLIST_CACHE_MAX_SIZE:10000}
app.security.jwt-denylist.cleanup-cron=${JWT_DENYLIST_CLEANUP_CRON:0 0 * * * *}
app.security.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:7776000000}
app.security.trust-forwarded-headers=${TRUST_FORWARDED_HEADERS:false}
app.security.trusted-proxy-ips=${TRUSTED_PROXY_IPS:}
app.security.public-api-docs=${PUBLIC_API_DOCS:false}
app.security.require-https=${REQUIRE_HTTPS:false}

# Thymeleaf
spring.thymeleaf.check-template-location=false

# CORS
# Local Flutter web runs use random localhost ports. Production overrides this
# in application-prod.properties and should set ALLOWED_ORIGINS explicitly.
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://[::1]:*}

# Public Base URL
app.public-url.base-url=${APP_PUBLIC_URL_BASE_URL:https://mybill-backend-vckc.onrender.com}

# Upload Directory
app.upload-dir=uploads

# Cloudinary signed direct uploads. Secrets must come from environment/secrets.
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.cloudinary.upload-preset=${CLOUDINARY_UPLOAD_PRESET:mybill_restricted_images}

# Multipart Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=${MULTIPART_FILE_SIZE_THRESHOLD:64KB}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Gmail SMTP Configuration for Device Verification OTPs
# Port 465 (implicit SSL) is used instead of 587 (STARTTLS) because cloud
# hosts like Render frequently block outbound STARTTLS on 587 while allowing
# the SSL port 465.
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=mybill.dev@gmail.com
spring.mail.password=ofntmwxrnbinhrzm
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.debug=true
spring.mail.properties.mail.smtp.connectiontimeout=25000
spring.mail.properties.mail.smtp.timeout=25000
spring.mail.properties.mail.smtp.writetimeout=25000

# Transactional email delivery via Resend HTTPS API (port 443).
# Render blocks outbound SMTP (ports 587/465), so OTP emails are sent over
# HTTPS instead. Set RESEND_API_KEY and RESEND_FROM_EMAIL in Render env.
app.mail.provider=${MAIL_PROVIDER:resend}
app.mail.resend.api-key=${RESEND_API_KEY:}
app.mail.resend.from=${RESEND_FROM_EMAIL:}
spring.flyway.placeholders.createExtensionCommand=CREATE EXTENSION IF NOT EXISTS "uuid-ossp"

spring.jpa.properties.hibernate.jdbc.batch_size=${HIBERNATE_BATCH_SIZE:25}
spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=${HIBERNATE_GENERATE_STATISTICS:false}
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=100
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/html
server.compression.min-response-size=1024
server.tomcat.threads.max=${TOMCAT_THREADS_MAX:50}
server.tomcat.threads.min-spare=${TOMCAT_THREADS_MIN_SPARE:4}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:50}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:200}

# Monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus,caches,loggers
management.endpoint.health.show-details=when_authorized
management.endpoint.health.show-components=always
management.health.defaults.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=${HTTP_METRICS_HISTOGRAMS:false}
management.metrics.distribution.slo.http.server.requests=50ms,100ms,250ms,500ms,1s,2s
management.metrics.enable.cache=${CACHE_METRICS_ENABLED:true}

# Fraud detection thresholds (configurable via environment)
app.fraud.amount-threshold=${FRAUD_AMOUNT_THRESHOLD:10000.0}
app.fraud.velocity-limit=${FRAUD_VELOCITY_LIMIT:5}
app.fraud.velocity-window-minutes=${FRAUD_VELOCITY_WINDOW_MINUTES:10}

# Data retention defaults
app.retention.soft-delete-days=${RETENTION_SOFT_DELETE_DAYS:30}
app.retention.log-retention-days=${RETENTION_LOG_RETENTION_DAYS:180}
app.retention.cron=${RETENTION_CRON:0 0 2 * * ?}

# Slow query timing
logging.level.org.hibernate.SQL_SLOW=INFO
logging.level.org.hibernate.stat=${HIBERNATE_STAT_LOG_LEVEL:OFF}

# Micrometer Tracing
management.tracing.enabled=${TRACING_ENABLED:false}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.0}

# Resilience4j Circuit Breakers Configuration
resilience4j.circuitbreaker.instances.googleDriveService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.googleDriveService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.googleDriveService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.googleDriveService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.googleDriveService.waitDurationInOpenState=10000

# Async Job Queue Alerts Configurations
app.async-jobs.dlq-alert-threshold=${ASYNC_JOBS_DLQ_ALERT_THRESHOLD:10}
app.async-jobs.poll-batch-size=${ASYNC_JOBS_POLL_BATCH_SIZE:5}
app.async-jobs.admin-page-size=${ASYNC_JOBS_ADMIN_PAGE_SIZE:100}
app.async-jobs.running-timeout-minutes=${ASYNC_JOBS_RUNNING_TIMEOUT_MINUTES:15}
app.async-jobs.poll-interval-ms=${ASYNC_JOBS_POLL_INTERVAL_MS:60000}
app.async.core-pool-size=${ASYNC_CORE_POOL_SIZE:4}
app.async.max-pool-size=${ASYNC_MAX_POOL_SIZE:16}
app.async.queue-capacity=${ASYNC_QUEUE_CAPACITY:500}
app.http-client.threads=${HTTP_CLIENT_THREADS:2}
app.notifications.reminders.batch-size=${NOTIFICATION_REMINDER_BATCH_SIZE:100}
app.sync.max-decompressed-bytes=${SYNC_MAX_DECOMPRESSED_BYTES:5242880}

# Scheduling defaults (disabled for lightweight environments)
app.scheduling.enabled=${SCHEDULING_ENABLED:false}
app.notifications.retry.enabled=${NOTIFICATIONS_RETRY_ENABLED:false}
app.reports.backend-enabled=${REPORTS_BACKEND_ENABLED:false}
app.legacy-files.enabled=${LEGACY_FILES_ENABLED:true}
